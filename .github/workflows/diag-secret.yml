name: Secret Transmission Diagnostic
on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Report length and hash only (never the raw value)
        env:
          T: ${{ secrets.TEST_TOKEN_DIAG }}
        run: |
          echo "length: ${#T}"
          echo -n "$T" | sha256sum
